<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Question Bank</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/jpeg" href="favicon.jpeg">
</head>
<body class="bg-light">
  <div class="container-fluid vh-100 d-flex align-items-center justify-content-center bg-primary bg-opacity-10">
    <div class="row w-100 justify-content-center">
      <div class="col-lg-4 col-md-6 col-sm-8">
        <div class="card shadow-lg border-0 rounded-3">
          <div class="card-body p-5">
            <div class="text-center mb-4">
              <i class="bi bi-person-circle display-4 text-primary mb-3"></i>
              <h2 class="fw-bold text-dark">Login</h2>
              <p class="text-muted">Access your question bank account</p>
            </div>
            
            <form id="loginForm">
              <div class="mb-3">
                <label class="form-label fw-semibold">Username</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-person"></i></span>
                  <input type="text" class="form-control" id="username" placeholder="Enter username" required>
                </div>
              </div>
              
              <div class="mb-4">
                <label class="form-label fw-semibold">Password</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-lock"></i></span>
                  <input type="password" class="form-control" id="password" placeholder="Enter password" required>
                </div>
              </div>
              
              <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                <i class="bi bi-box-arrow-in-right me-2"></i>Login
              </button>
              
              <div class="text-center mt-3">
                <a href="forgot-password.html" class="text-decoration-none">
                  <i class="bi bi-question-circle me-1"></i>Forgot Password?
                </a>
              </div>
              
              <div class="text-center mt-2">
                <a href="register.html" class="text-decoration-none">
                  <i class="bi bi-person-plus me-1"></i>Create New Account
                </a>
              </div>
              
              <div id="message" class="alert alert-dismissible fade show mt-3 d-none" role="alert">
                <span id="messageText"></span>
                <button type="button" class="btn-close" onclick="hideMessage()"></button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function showMessage(message, type = 'danger') {
      const messageDiv = document.getElementById('message');
      const messageText = document.getElementById('messageText');
      
      messageText.textContent = message;
      messageDiv.className = `alert alert-${type} alert-dismissible fade show mt-3`;
      messageDiv.classList.remove('d-none');
    }

    function hideMessage() {
      document.getElementById('message').classList.add('d-none');
    }

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      
      if (!username || !password) {
        showMessage('Please fill in all fields');
        return;
      }

      const submitBtn = this.querySelector('button[type="submit"]');
      const originalText = submitBtn.innerHTML;
      submitBtn.innerHTML = '<i class="bi bi-arrow-repeat spinner me-2"></i>Logging in...';
      submitBtn.disabled = true;

      try {
        console.log('🔐 Login attempt for:', username);
        
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ username, password })
        });

        console.log('Login response status:', response.status);
        
        const data = await response.json();
        console.log('Login response data:', data);

        if (data.token) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('role', data.role);
          localStorage.setItem('username', username);
          
          showMessage('Login successful! Redirecting...', 'success');
          
          setTimeout(() => {
            if (data.role === 'admin') {
              window.location.href = 'admin-dashboard.html';
            } else {
              window.location.href = 'student-dashboard.html';
            }
          }, 1000);
          
        } else {
          showMessage(data.error || 'Login failed. Please check your credentials.');
        }
      } catch (error) {
        console.error('Login error:', error);
        showMessage('Network error: ' + error.message);
      } finally {
        submitBtn.innerHTML = originalText;
        submitBtn.disabled = false;
      }
    });

    const style = document.createElement('style');
    style.textContent = `
      .spinner { 
        animation: spin 1s linear infinite; 
      }
      @keyframes spin { 
        from { transform: rotate(0deg); } 
        to { transform: rotate(360deg); } 
      }
    `;
    document.head.appendChild(style);

    window.addEventListener('load', function() {
      const token = localStorage.getItem('token');
      const role = localStorage.getItem('role');
      
      if (token && role) {
        if (role === 'admin') {
          window.location.href = 'admin-dashboard.html';
        } else {
          window.location.href = 'student-dashboard.html';
        }
      }
    });
  </script>
</body>
</html>
