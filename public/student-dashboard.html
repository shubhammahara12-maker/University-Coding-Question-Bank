<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/jpeg" href="favicon.jpeg">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-success shadow">
    <div class="container">
      <span class="navbar-brand fw-bold">
        <i class="bi bi-journal-code me-2"></i>Student Dashboard
      </span>
      <div class="d-flex align-items-center">
        <span class="text-light me-3">Welcome, Student</span>
        <button class="btn btn-outline-light btn-sm" onclick="logout()">
          <i class="bi bi-box-arrow-right me-1"></i>Logout
        </button>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    <div class="card shadow-sm border-0 mb-4">
      <div class="card-header bg-white border-0 py-3">
        <h5 class="card-title mb-0">
          <i class="bi bi-funnel text-primary me-2"></i>Filter Questions
        </h5>
      </div>
      <div class="card-body">
        <div class="row g-3" id="filters"></div>
      </div>
    </div>

    <div class="card shadow-sm border-0">
      <div class="card-header bg-white border-0 py-3">
        <h5 class="card-title mb-0">
          <i class="bi bi-code-square text-info me-2"></i>Coding Questions
        </h5>
      </div>
      <div class="card-body">
        <div id="questions" class="row g-3"></div>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (localStorage.getItem('role') !== 'student')
        window.location = 'login.html';
      loadFilters();
      loadQuestions({});
    });
  </script>
</body>
</html>
