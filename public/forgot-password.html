<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Question Bank</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/jpeg" href="favicon.jpeg">
</head>
<body class="bg-light">
  <div class="container-fluid vh-100 d-flex align-items-center justify-content-center bg-primary bg-opacity-10">
    <div class="row w-100 justify-content-center">
      <div class="col-lg-5 col-md-7 col-sm-9">
        <div class="card shadow-lg border-0 rounded-3">
          <div class="card-body p-5">
            <div class="text-center mb-4">
              <i class="bi bi-key display-4 text-warning mb-3"></i>
              <h2 class="fw-bold text-dark">Reset Password</h2>
              <p class="text-muted">Enter your details to reset your password</p>
            </div>
            
            <div id="step1">
              <div class="mb-4">
                <label class="form-label fw-semibold">Username</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-person"></i></span>
                  <input type="text" class="form-control" id="username" placeholder="Enter your username" required>
                </div>
              </div>
              <button class="btn btn-warning w-100 py-2 fw-semibold" onclick="getSecurityQuestion()">
                <i class="bi bi-arrow-right me-2"></i>Continue
              </button>
            </div>
            
            <div id="step2" class="d-none">
              <div class="mb-3">
                <label class="form-label fw-semibold">Security Question</label>
                <div class="alert alert-info">
                  <i class="bi bi-question-circle me-2"></i>
                  <strong id="securityQuestionLabel">What was the name of your favorite teacher in secondary school?</strong>
                </div>
              </div>
              
              <div class="mb-3">
                <label class="form-label fw-semibold">Your Answer</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
                  <input type="text" class="form-control" id="securityAnswer" placeholder="Enter your answer" required>
                </div>
              </div>
              
              <div class="mb-4">
                <label class="form-label fw-semibold">New Password</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-lock"></i></span>
                  <input type="password" class="form-control" id="newPassword" placeholder="Enter new password (min 6 characters)" required>
                </div>
                <div class="form-text">Password must be at least 6 characters long</div>
              </div>
              
              <div class="d-grid gap-2">
                <button class="btn btn-success w-100 py-2 fw-semibold" onclick="resetPassword()">
                  <i class="bi bi-key me-2"></i>Reset Password
                </button>
                <button class="btn btn-secondary w-100 py-2" onclick="goBackToStep1()">
                  <i class="bi bi-arrow-left me-2"></i>Back
                </button>
              </div>
            </div>
            
            <div class="text-center mt-3">
              <a href="login.html" class="text-decoration-none">
                <i class="bi bi-arrow-left me-1"></i>Back to Login
              </a>
            </div>
            
            <div id="message" class="alert alert-dismissible fade show mt-3 d-none" role="alert">
              <span id="messageText"></span>
              <button type="button" class="btn-close" onclick="hideMessage()"></button>
            </div>

            <div class="mt-3 p-2 bg-light rounded small">
              <strong>Debug Info:</strong>
              <div id="debugInfo" class="text-muted">Ready...</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentUsername = '';

    function updateDebugInfo(message) {
      document.getElementById('debugInfo').textContent = message;
      console.log('DEBUG:', message);
    }

    function showMessage(message, type = 'danger') {
      const messageDiv = document.getElementById('message');
      const messageText = document.getElementById('messageText');
      
      messageText.textContent = message;
      messageDiv.className = `alert alert-${type} alert-dismissible fade show mt-3`;
      messageDiv.classList.remove('d-none');
    }

    function hideMessage() {
      document.getElementById('message').classList.add('d-none');
    }

    async function getSecurityQuestion() {
      const username = document.getElementById('username').value.trim();
      
      if (!username) {
        showMessage('Please enter your username');
        return;
      }

      currentUsername = username;
      updateDebugInfo(`Getting security question for: ${username}`);
      
      const continueBtn = document.querySelector('#step1 button');
      const originalText = continueBtn.innerHTML;
      continueBtn.innerHTML = '<i class="bi bi-arrow-repeat spinner me-2"></i>Checking...';
      continueBtn.disabled = true;

      try {
        const response = await fetch('/api/get-security-question', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ username: username })
        });

        updateDebugInfo(`Response status: ${response.status}`);
        
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }

        const data = await response.json();
        updateDebugInfo(`Response: ${JSON.stringify(data)}`);

        if (data.success) {
          document.getElementById('step1').classList.add('d-none');
          document.getElementById('step2').classList.remove('d-none');
          document.getElementById('securityQuestionLabel').textContent = data.security_question;
          showMessage('Please answer your security question and set a new password', 'info');
        } else {
          showMessage(data.error || 'Failed to get security question');
        }
      } catch (error) {
        console.error('Error:', error);
        showMessage('Network error: ' + error.message);
        updateDebugInfo('Error: ' + error.message);
      } finally {
        continueBtn.innerHTML = originalText;
        continueBtn.disabled = false;
      }
    }

    async function resetPassword() {
      const securityAnswer = document.getElementById('securityAnswer').value.trim();
      const newPassword = document.getElementById('newPassword').value;

      if (!securityAnswer) {
        showMessage('Please enter your security answer');
        return;
      }

      if (!newPassword || newPassword.length < 6) {
        showMessage('Please enter a new password with at least 6 characters');
        return;
      }

      updateDebugInfo(`Resetting password for: ${currentUsername}`);
      
      const resetBtn = document.querySelector('#step2 .btn-success');
      const originalText = resetBtn.innerHTML;
      resetBtn.innerHTML = '<i class="bi bi-arrow-repeat spinner me-2"></i>Resetting...';
      resetBtn.disabled = true;

      try {
        const response = await fetch('/api/reset-password', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            username: currentUsername,
            security_answer: securityAnswer,
            new_password: newPassword
          })
        });

        updateDebugInfo(`Response status: ${response.status}`);
        
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }

        const data = await response.json();
        updateDebugInfo(`Response: ${JSON.stringify(data)}`);

        if (data.success) {
          showMessage('Password reset successfully! Redirecting to login page...', 'success');
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 2000);
        } else {
          showMessage(data.error || 'Password reset failed');
        }
      } catch (error) {
        console.error('Error:', error);
        showMessage('Network error: ' + error.message);
        updateDebugInfo('Error: ' + error.message);
      } finally {
        resetBtn.innerHTML = originalText;
        resetBtn.disabled = false;
      }
    }

    function goBackToStep1() {
      document.getElementById('step2').classList.add('d-none');
      document.getElementById('step1').classList.remove('d-none');
      hideMessage();
      updateDebugInfo('Returned to step 1');
    }

    document.getElementById('username').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        getSecurityQuestion();
      }
    });

    document.getElementById('securityAnswer').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        resetPassword();
      }
    });

    document.getElementById('newPassword').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        resetPassword();
      }
    });

    const style = document.createElement('style');
    style.textContent = `
      .spinner { 
        animation: spin 1s linear infinite; 
      }
      @keyframes spin { 
        from { transform: rotate(0deg); } 
        to { transform: rotate(360deg); } 
      }
    `;
    document.head.appendChild(style);

    updateDebugInfo('Page loaded successfully. Enter username and click Continue.');
  </script>
</body>
</html>
